name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SymphonyRecomp
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Checkout disc source
        uses: actions/checkout@v4
        with:
          repository: BlackLabelHQ/SymphonyDiscSource
          token: ${{ secrets.DISC_SOURCE_PAT }}
          path: disc
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build recompiler
        run: dotnet build RecompOne/RecompOne.Recompiler/RecompOne.Recompiler.csproj -c Release

      - name: Run recompilation
        run: dotnet run --project RecompOne/RecompOne.Recompiler -c Release --no-build -- config/sotn.json

      - name: Upload generated source
        uses: actions/upload-artifact@v4
        with:
          name: generated-source
          path: generated/

  build:
    needs: [generate]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            asset: windows-x64
            archive: zip
            outputType: WinExe
          - rid: win-arm64
            asset: windows-arm64
            archive: zip
            outputType: WinExe
          - rid: linux-x64
            asset: linux-x64
            archive: tar
            outputType: Exe
          - rid: osx-x64
            asset: macos-x64
            archive: zip
            outputType: Exe
          - rid: osx-arm64
            asset: macos-arm64
            archive: zip
            outputType: Exe
    steps:
      - name: Checkout SymphonyRecomp
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download generated source
        uses: actions/download-artifact@v4
        with:
          name: generated-source
          path: generated

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (framework-dependent, ReadyToRun)
        run: >
          dotnet publish RecompOne.SoTN.csproj -c Release
          -r ${{ matrix.rid }}
          --self-contained false
          -p:PublishSingleFile=false
          -p:PublishReadyToRun=true
          -p:OutputType=${{ matrix.outputType }}
          -p:UseRidGraph=true
          -p:InformationalVersion=${{ github.ref_name }}
          -p:NoWarn=0162
          -o publish/${{ matrix.rid }}

      - name: check achs
        shell: bash
        run: |
          case "${{ matrix.rid }}" in
            *-x64) want='x86-64|x86_64' ;;
            *-arm64) want='aarch64|arm64|Aarch64|ARM64' ;;
            *) exit 0 ;;
          esac
          bad=0
          while IFS= read -r f; do
            info=$(file -b "$f")
            case "$info" in *Mono/.Net*|*text*) continue ;; esac
            if ! echo "$info" | grep -Eq "$want"; then echo "::error file=$f::wrong architecture for ${{ matrix.rid }}: $info"; bad=1; fi
          done < <(find "publish/${{ matrix.rid }}" -type f \( -name '*.dylib' -o -name '*.so' -o -name '*.so.*' -o -name '*.dll' \))
          exit $bad

      - name: Bundle linux run launchr
        if: startsWith(matrix.rid, 'linux')
        run: |
          cp run.sh "publish/${{ matrix.rid }}/run.sh"
          chmod +x "publish/${{ matrix.rid }}/run.sh"
          chmod +x "publish/${{ matrix.rid }}/sotn"

      - name: Bundle first party mods
        run: |
          if [ -d mods ]; then
            rsync -a --exclude '.git*' --exclude '.cache' mods/ "publish/${{ matrix.rid }}/mods/"
            echo "bundled mods:"
            find "publish/${{ matrix.rid }}/mods" -name mod.json | sed 's|.*/mods/||'
          else
            echo "mods/ not present, skipping"
          fi

      - name: Package (zip)
        if: matrix.archive == 'zip'
        run: |
          cd publish/${{ matrix.rid }}
          zip -r "../../SymphonyRecomp-${{ github.ref_name }}-${{ matrix.asset }}.zip" .

      - name: Package (tar.gz)
        if: matrix.archive == 'tar'
        run: |
          cd publish/${{ matrix.rid }}
          tar -czf "../../SymphonyRecomp-${{ github.ref_name }}-${{ matrix.asset }}.tar.gz" .

      - name: Upload packaged build
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.asset }}
          path: SymphonyRecomp-${{ github.ref_name }}-${{ matrix.asset }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout SymphonyRecomp
        uses: actions/checkout@v4

      - name: Download packaged builds
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Build release notes
        run: |
          notes=$(ls changelog.md CHANGELOG.md 2>/dev/null | head -n 1)
          if [ -n "$notes" ] && [ -s "$notes" ]; then
            cp "$notes" release_notes.md
          else
            printf 'SymphonyRecomp %s\n' "$GITHUB_REF_NAME" > release_notes.md
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: dist/*
